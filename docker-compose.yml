name: treebeard-testdb

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DATABASE_USER_POSTGRES:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-treebeard}
      POSTGRES_DB: treebeard
    ports:
      - "${DATABASE_PORT_POSTGRES:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  mysql:
    image: mysql:9.5
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-treebeard}
      MYSQL_DATABASE: treebeard
    ports:
      - "${DATABASE_PORT_MYSQL:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Password12!}
    ports:
      - "${DATABASE_PORT_MSSQL:-1433}:1433"
